services:
  frontend-demo-api:
    build:
      context: frontend
      dockerfile: Dockerfile
    container_name: frontend-demo-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NUXT_PUBLIC_API_BASE_URL=http://localhost
      - NUXT_API_BASE_URL=http://webserver:80 
  webserver:
    image: nginx
    container_name: loadbalancer
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./backend/nginx.conf:/etc/nginx/nginx.conf:ro

  api:
    build:
      context: backend
      dockerfile: dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_ROLE: api
      OLLAMA_HOST: http://ollama:11434
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: postgressql://postgres:supersecret123@database:5432/minitwitter
    depends_on:
      - database
    deploy:
      replicas: 2

  worker:
    build:
      context: backend
      dockerfile: dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_ROLE: worker
      OLLAMA_HOST: http://ollama:11434
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: postgressql://postgres:supersecret123@database:5432/minitwitter

  database:
    image: postgres:latest
    container_name: postgresSQL
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file:
      - .env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: supersecret123
      POSTGRES_DB: minitwitter
    volumes:
      - ./backend/docker-data:/var/lib/postgresql

  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "12434:11434"
    volumes:
      - ./backend/docker-data/ollama_data:/root/.ollama
  
  redis:
    container_name: redis
    image: redis/redis-stack:latest
    restart: always
    ports:
      - "6379:6379" # Redis server
      - "8001:8001" # RedisInsight
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
    volumes: 
      - ./backend/docker-data/redis:/data

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
    - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports: 
    - 3100:3000
    volumes:
    - ./backend/docker-data/grafana:/var/lib/grafana
    
  database_migration:
    build:
      context: backend
      dockerfile: dockerfile
    depends_on:
      - database
    environment:
      DATABASE_URL: postgressql://postgres:supersecret123@database:5432/minitwitter
    command: ["bash", "-c", "sleep 10 && bunx drizzle-kit push"]
    restart: "no"