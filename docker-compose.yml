services:
  webserver:
    image: nginx
    container_name: loadbalancer
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./backend/nginx.conf:/etc/nginx/nginx.conf:ro

  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - SERVER_ROLE=api
      - OLLAMA_HOST=${OLLAMA_HOST}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
    depends_on:
      - database
    deploy:
      replicas: 2

  worker:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - SERVER_ROLE=worker
      - OLLAMA_HOST=${OLLAMA_HOST}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}

  database:
    image: postgres:latest
    container_name: postgresSQL
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./backend/postgres_data:/var/lib/postgresql

  database_migration:
    build: ./backend
    depends_on:
      - database
    environment:
      - DATABASE_URL=${DATABASE_URL_DOCKER}
    command: ["bash", "-c", "sleep 10 && bunx drizzle-kit push"]
    restart: "no"

  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "12434:11434"
    volumes:
      - ./backend/postgres_data/ollama_data:/root/.ollama
  
  redis:
    container_name: redis
    image: redis/redis-stack:latest
    restart: always
    ports:
      - "6379:6379" # Redis server
      - "8001:8001" # RedisInsight
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
    volumes: 
      - ./backend/postgres_data/redis:/data